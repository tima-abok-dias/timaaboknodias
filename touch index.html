<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый сайт</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 25px;
            text-align: center;
            background: rgba(0, 0, 0, 0.15);
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 18px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #ffe082;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            max-width: 550px;
            margin-bottom: 25px;
        }

        button {
            background: white;
            color: #6246a5;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            background: #ffe082;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.15);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h2>Мой сайт</h2>
    </header>

    <nav>
        <a href="#home">Главная</a>
        <a href="#about">О сайте</a>
        <a href="#contacts">Контакты</a>
    </nav>

    <main id="home">
        <h1>Добро пожаловать!</h1>

        <p id="about">
            Это мой первый сайт, созданный с помощью HTML и CSS.
            Я учусь программировать и работать с Git и GitHub.
        </p>

        <button onclick="showMessage()">
            Нажми меня
        </button>

        <p id="message"></p>
    </main>

    <footer id="contacts">
        <p>©️ 2026 Мой первый сайт</p>
    </footer>

    <script>
        function showMessage() {
            document.getElementById("message").textContent =
                "Отлично! Кнопка работает 🎉";
        }
    </script>
</body>
</html>
